<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1860" viewBox="0 0 1800 1860" role="img" aria-labelledby="title desc">
  <title id="title">ZENdian 主页与二级面板预览</title>
  <desc id="desc">基于上一版主页布局的浅色卡片式 UI 预览，包括主页、所有项目、项目控制台、设置、项目详情、任务编辑和专注时钟。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <filter id="small-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#334155" flood-opacity="0.08"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#64748b" opacity="0.13"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6676df"/>
      <stop offset="1" stop-color="#5364cb"/>
    </linearGradient>
    <linearGradient id="blue-note" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="green-note" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <style>
      .page { fill: #f5f6f8; }
      .frame { fill: #ffffff; stroke: #e3e7ee; stroke-width: 1; }
      .surface { fill: #ffffff; stroke: #e7eaf0; stroke-width: 1; }
      .soft { fill: #fafbfc; stroke: #e7eaf0; stroke-width: 1; }
      .line { stroke: #e8ebf0; stroke-width: 1; }
      .ink { fill: #263142; }
      .copy { fill: #667085; }
      .faint { fill: #98a2b3; }
      .accent { fill: #5c6ed8; }
      .label { fill: #8a94a6; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
      .title { fill: #253044; font-size: 17px; font-weight: 650; }
      .small { fill: #667085; font-size: 12px; }
      .tiny { fill: #98a2b3; font-size: 10px; }
      .button { fill: #ffffff; stroke: #dfe4ec; stroke-width: 1; }
      .button-text { fill: #667085; font-size: 11px; font-weight: 600; }
      .accent-button { fill: url(#accent); }
      .accent-button-text { fill: #ffffff; font-size: 11px; font-weight: 650; }
      .row:hover { fill: #f7f8fc; }
    </style>
  </defs>

  <rect width="1800" height="1860" class="page"/>
  <rect width="1800" height="1860" fill="url(#dots)" opacity="0.42"/>

  <text x="76" y="70" class="ink" font-size="24" font-weight="700">ZENdian</text>
  <text x="76" y="98" class="copy" font-size="14">主页与面板预览 · 以仓库上一版主页为视觉基准</text>
  <text x="1724" y="82" class="faint" font-size="12" text-anchor="end">浅色主题示意 · 强调色随 Obsidian 主题色变化</text>

  <!-- Homepage -->
  <text x="76" y="144" class="label">主页</text>
  <g transform="translate(76 166)" filter="url(#shadow)">
    <rect width="1648" height="620" rx="20" class="frame"/>
    <rect width="1648" height="620" rx="20" fill="url(#dots)" opacity="0.36"/>

    <g transform="translate(34 28)">
      <text x="0" y="25" class="ink" font-size="24" font-weight="700">下午好，Junkey <tspan font-size="20">✦</tspan></text>
      <text x="0" y="49" class="copy" font-size="12">2026年11月4日 · 先处理最重要的一件事</text>
      <text x="0" y="70" class="faint" font-size="12" font-style="italic">Small steps, clear mind.</text>

      <g transform="translate(975 0)">
        <rect width="280" height="38" rx="19" class="surface"/>
        <text x="18" y="24" class="faint" font-size="13">⌕</text>
        <text x="42" y="24" class="faint" font-size="12">搜索笔记、项目或任务</text>
        <text x="254" y="24" class="faint" font-size="10">⌘K</text>
      </g>
      <g transform="translate(1270 0)">
        <rect width="310" height="62" rx="14" class="surface" filter="url(#small-shadow)"/>
        <circle cx="30" cy="31" r="18" fill="#fff9dd"/>
        <text x="21" y="37" font-size="18">☀</text>
        <text x="58" y="28" class="ink" font-size="14" font-weight="650">22°  晴</text>
        <text x="58" y="46" class="copy" font-size="11">杭州 · 适合出门走走</text>
      </g>
    </g>

    <!-- cards row 1 -->
    <g transform="translate(34 120)">
      <rect width="760" height="190" rx="14" class="surface" filter="url(#small-shadow)"/>
      <text x="22" y="30" class="title">每日回顾</text>
      <text x="697" y="30" class="accent" font-size="12" text-anchor="end">查看详情  ›</text>
      <line x1="22" y1="46" x2="738" y2="46" class="line"/>
      <circle cx="105" cy="117" r="47" fill="none" stroke="#edf0f5" stroke-width="9"/>
      <path d="M105 70 A47 47 0 1 1 68 145" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/>
      <text x="105" y="113" class="ink" font-size="24" font-weight="700" text-anchor="middle">68%</text>
      <text x="105" y="131" class="faint" font-size="10" text-anchor="middle">完成度</text>
      <g transform="translate(205 74)">
        <text x="0" y="0" class="copy" font-size="12">今日完成</text>
        <text x="0" y="30" class="ink" font-size="24" font-weight="700">8 <tspan class="faint" font-size="12" font-weight="400">/ 12 项</tspan></text>
        <text x="0" y="57" class="small">还有 4 项待处理</text>
      </g>
      <g transform="translate(514 70)">
        <text x="0" y="0" class="small">✓  完成晨间计划</text>
        <text x="0" y="25" class="small">✓  整理项目资料</text>
        <text x="0" y="50" class="small">○  复盘今日笔记</text>
      </g>
    </g>

    <g transform="translate(816 120)">
      <rect width="798" height="190" rx="14" class="surface" filter="url(#small-shadow)"/>
      <text x="22" y="30" class="title">我的项目</text>
      <rect x="650" y="12" width="58" height="26" rx="13" class="button"/>
      <text x="679" y="29" class="button-text" text-anchor="middle">全部</text>
      <rect x="718" y="12" width="58" height="26" rx="13" class="accent-button"/>
      <text x="747" y="29" class="accent-button-text" text-anchor="middle">＋ 新建</text>
      <line x1="22" y1="46" x2="776" y2="46" class="line"/>
      <g transform="translate(22 68)">
        <rect width="360" height="52" rx="10" class="soft"/>
        <circle cx="25" cy="26" r="13" fill="#eef2ff"/><text x="25" y="30" class="accent" font-size="12" text-anchor="middle">↗</text>
        <text x="49" y="23" class="ink" font-size="12" font-weight="600">ZENdian 插件优化</text>
        <text x="49" y="40" class="faint" font-size="10">进行中 · 68%</text>
        <rect x="250" y="37" width="84" height="4" rx="2" fill="#e9ecf5"/><rect x="250" y="37" width="57" height="4" rx="2" fill="#6273d7"/>
      </g>
      <g transform="translate(398 68)">
        <rect width="360" height="52" rx="10" class="soft"/>
        <circle cx="25" cy="26" r="13" fill="#ecfdf5"/><text x="25" y="30" fill="#36a269" font-size="12" text-anchor="middle">✓</text>
        <text x="49" y="23" class="ink" font-size="12" font-weight="600">城市地下空间模型</text>
        <text x="49" y="40" class="faint" font-size="10">已完成 · 100%</text>
        <rect x="250" y="37" width="84" height="4" rx="2" fill="#d9f3e6"/><rect x="250" y="37" width="84" height="4" rx="2" fill="#48b97d"/>
      </g>
      <text x="22" y="158" class="faint" font-size="11">管理项目、查看进度，或进入项目控制台</text>
    </g>

    <!-- cards row 2 -->
    <g transform="translate(34 328)">
      <rect width="760" height="246" rx="14" class="surface" filter="url(#small-shadow)"/>
      <text x="22" y="30" class="title">待办事项</text>
      <g transform="translate(22 47)">
        <rect width="716" height="30" rx="7" fill="#fafbfc"/>
        <text x="14" y="20" class="accent" font-size="11" font-weight="650">全部</text><text x="68" y="20" class="faint" font-size="11">今天</text><text x="116" y="20" class="faint" font-size="11">本周</text><text x="169" y="20" class="faint" font-size="11">已完成</text>
        <text x="683" y="20" class="accent" font-size="12" text-anchor="end">＋</text>
      </g>
      <g transform="translate(22 91)">
        <circle cx="9" cy="9" r="8" fill="#fff" stroke="#d6dce8"/><text x="27" y="13" class="ink" font-size="12">整理 settings 面板的窗口入口</text><text x="697" y="13" class="faint" font-size="10" text-anchor="end">今天</text>
        <line x1="0" y1="29" x2="716" y2="29" class="line"/>
        <circle cx="9" cy="48" r="8" fill="#fff" stroke="#d6dce8"/><text x="27" y="52" class="ink" font-size="12">补充主页二级面板的空状态</text><text x="697" y="52" class="faint" font-size="10" text-anchor="end">明天</text>
        <line x1="0" y1="68" x2="716" y2="68" class="line"/>
        <circle cx="9" cy="87" r="8" fill="#6273d7" stroke="#6273d7"/><text x="27" y="91" fill="#98a2b3" font-size="12" text-decoration="line-through">检查项目进度条的视觉层级</text><text x="697" y="91" class="faint" font-size="10" text-anchor="end">已完成</text>
      </g>
    </g>

    <g transform="translate(816 328)">
      <rect width="798" height="246" rx="14" class="surface" filter="url(#small-shadow)"/>
      <text x="22" y="30" class="title">便签</text>
      <text x="753" y="30" class="accent" font-size="12" text-anchor="end">＋</text>
      <g transform="translate(22 50)">
        <rect width="212" height="170" rx="11" fill="#fffbeb" stroke="#f7e7b2"/>
        <text x="16" y="27" class="ink" font-size="12" font-weight="650">今天的提醒</text>
        <text x="16" y="55" class="copy" font-size="11">先完成最重要的事情，</text><text x="16" y="73" class="copy" font-size="11">再处理零散消息。</text>
        <text x="16" y="146" class="faint" font-size="10">2026-11-04</text>
      </g>
      <g transform="translate(252 50)">
        <rect width="212" height="170" rx="11" fill="url(#blue-note)" stroke="#dce3fb"/>
        <text x="16" y="27" class="ink" font-size="12" font-weight="650">灵感</text>
        <text x="16" y="55" class="copy" font-size="11">把信息变成可以继续</text><text x="16" y="73" class="copy" font-size="11">行动的下一步。</text>
        <text x="16" y="146" class="faint" font-size="10">灵感 · 笔记</text>
      </g>
      <g transform="translate(482 50)">
        <rect width="212" height="170" rx="11" fill="url(#green-note)" stroke="#d2efdf"/>
        <text x="16" y="27" class="ink" font-size="12" font-weight="650">进展</text>
        <text x="16" y="55" class="copy" font-size="11">今天已经完成了 8 项，</text><text x="16" y="73" class="copy" font-size="11">保持这个节奏。</text>
        <text x="16" y="146" class="faint" font-size="10">记录 · 今日</text>
      </g>
    </g>
  </g>

  <!-- Secondary panels -->
  <text x="76" y="842" class="label">二级面板</text>

  <!-- all projects -->
  <g transform="translate(76 864)" filter="url(#shadow)">
    <rect width="800" height="360" rx="18" class="frame"/>
    <text x="28" y="42" class="ink" font-size="20" font-weight="700">所有项目</text>
    <text x="28" y="65" class="copy" font-size="12">集中查看项目状态、进度与最近更新</text>
    <rect x="570" y="22" width="92" height="30" rx="15" class="button"/><text x="616" y="41" class="button-text" text-anchor="middle">筛选</text>
    <rect x="672" y="22" width="100" height="30" rx="15" class="accent-button"/><text x="722" y="41" class="accent-button-text" text-anchor="middle">＋ 新建项目</text>
    <line x1="28" y1="89" x2="772" y2="89" class="line"/>
    <g transform="translate(28 111)">
      <rect width="744" height="64" rx="11" class="soft"/><circle cx="30" cy="32" r="15" fill="#eef2ff"/><text x="30" y="37" class="accent" text-anchor="middle">↗</text><text x="59" y="28" class="ink" font-size="13" font-weight="650">ZENdian 插件优化</text><text x="59" y="47" class="faint" font-size="11">最近更新：今天 14:32</text><text x="702" y="28" class="accent" font-size="11" text-anchor="end">进行中</text><text x="702" y="48" class="faint" font-size="11" text-anchor="end">68%</text>
    </g>
    <g transform="translate(28 187)">
      <rect width="744" height="64" rx="11" class="soft"/><circle cx="30" cy="32" r="15" fill="#ecfdf5"/><text x="30" y="37" fill="#36a269" text-anchor="middle">✓</text><text x="59" y="28" class="ink" font-size="13" font-weight="650">城市地下空间模型</text><text x="59" y="47" class="faint" font-size="11">最近更新：昨天 21:08</text><text x="702" y="28" fill="#36a269" font-size="11" text-anchor="end">已完成</text><text x="702" y="48" class="faint" font-size="11" text-anchor="end">100%</text>
    </g>
    <text x="28" y="303" class="faint" font-size="11">按钮：筛选 · 新建项目 · 项目卡片点击进入控制台</text>
  </g>

  <!-- project console -->
  <g transform="translate(900 864)" filter="url(#shadow)">
    <rect width="824" height="360" rx="18" class="frame"/>
    <text x="28" y="38" class="faint" font-size="11">主页 / 所有项目 / ZENdian 插件优化</text>
    <text x="28" y="73" class="ink" font-size="22" font-weight="700">ZENdian 插件优化</text>
    <text x="28" y="96" class="copy" font-size="12">统一主页、设置和项目面板的视觉语言</text>
    <rect x="678" y="58" width="116" height="30" rx="15" class="accent-button"/><text x="736" y="77" class="accent-button-text" text-anchor="middle">＋ 新建任务</text>
    <line x1="28" y1="119" x2="796" y2="119" class="line"/>
    <text x="28" y="147" class="accent" font-size="12" font-weight="650">任务</text><text x="82" y="147" class="faint" font-size="12">文档</text><text x="132" y="147" class="faint" font-size="12">设置</text>
    <g transform="translate(28 168)">
      <rect width="514" height="128" rx="12" class="soft"/>
      <text x="18" y="27" class="title">当前进度</text><text x="478" y="27" class="accent" font-size="12" text-anchor="end">68%</text>
      <rect x="18" y="48" width="470" height="7" rx="3.5" fill="#e9ecf5"/><rect x="18" y="48" width="320" height="7" rx="3.5" fill="#6273d7"/>
      <text x="18" y="82" class="small">已完成 8 项</text><text x="160" y="82" class="small">进行中 2 项</text><text x="302" y="82" class="small">待开始 4 项</text>
      <text x="18" y="107" class="faint" font-size="10">按钮：新建任务 · 编辑项目 · 切换标签</text>
    </g>
    <g transform="translate(562 168)">
      <rect width="234" height="128" rx="12" class="soft"/>
      <text x="18" y="27" class="title">项目摘要</text><text x="18" y="57" class="small">截止日期</text><text x="210" y="57" class="ink" font-size="12" text-anchor="end">11 月 12 日</text><text x="18" y="83" class="small">最近更新</text><text x="210" y="83" class="ink" font-size="12" text-anchor="end">今天 14:32</text>
    </g>
  </g>

  <!-- settings -->
  <g transform="translate(76 1272)" filter="url(#shadow)">
    <rect width="800" height="430" rx="18" class="frame"/>
    <text x="30" y="43" class="ink" font-size="20" font-weight="700">ZENdian 设置</text>
    <text x="30" y="65" class="copy" font-size="12">功能开关、主页信息和外观偏好</text>
    <rect x="30" y="88" width="740" height="44" rx="10" fill="#fafbfc" stroke="#e7eaf0"/>
    <rect x="40" y="96" width="90" height="28" rx="14" fill="#eef2ff"/><text x="85" y="114" class="accent" font-size="11" font-weight="650" text-anchor="middle">主页</text><text x="178" y="114" class="copy" font-size="11">项目</text><text x="246" y="114" class="copy" font-size="11">任务</text><text x="312" y="114" class="copy" font-size="11">移动端</text><text x="405" y="114" class="copy" font-size="11">关于</text>
    <g transform="translate(30 158)">
      <rect width="740" height="65" rx="10" class="surface"/><text x="18" y="27" class="ink" font-size="12" font-weight="650">启用主页</text><text x="18" y="47" class="faint" font-size="10">启动 Obsidian 时显示 ZENdian 主页</text><rect x="673" y="20" width="42" height="24" rx="12" fill="#6273d7"/><circle cx="703" cy="32" r="9" fill="#fff"/>
    </g>
    <g transform="translate(30 233)">
      <rect width="740" height="65" rx="10" class="surface"/><text x="18" y="27" class="ink" font-size="12" font-weight="650">面板使用新窗口</text><text x="18" y="47" class="faint" font-size="10">项目、待办、便签和专注时钟可独立打开</text><rect x="673" y="20" width="42" height="24" rx="12" fill="#6273d7"/><circle cx="703" cy="32" r="9" fill="#fff"/>
    </g>
    <g transform="translate(30 308)">
      <rect width="740" height="65" rx="10" class="surface"/><text x="18" y="27" class="ink" font-size="12" font-weight="650">主页搜索</text><text x="18" y="47" class="faint" font-size="10">在主页显示搜索框和快捷键提示</text><rect x="673" y="20" width="42" height="24" rx="12" fill="#dce1ea"/><circle cx="685" cy="32" r="9" fill="#fff"/>
    </g>
    <text x="30" y="404" class="faint" font-size="11">按钮：新窗口 · 重置全部设置 · 搜索设置项</text>
  </g>

  <!-- detail and form panels -->
