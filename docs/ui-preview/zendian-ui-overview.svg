      <text x="76" y="38" class="ink" font-size="16" font-weight="700">项目详情</text><text x="76" y="59" class="faint" font-size="11">项目状态、描述、进度和最近活动</text>
      <line x1="22" y1="83" x2="348" y2="83" class="line"/><text x="22" y="108" class="small">当前进度</text><text x="348" y="108" class="accent" font-size="11" text-anchor="end">68%</text><rect x="22" y="120" width="326" height="6" rx="3" fill="#e9ecf5"/><rect x="22" y="120" width="222" height="6" rx="3" fill="#6273d7"/><text x="22" y="149" class="faint" font-size="10">按钮：编辑项目 · 关闭</text>
    </g>
    <g transform="translate(422 68)">
      <rect width="372" height="160" rx="14" class="surface"/>
      <text x="22" y="32" class="ink" font-size="16" font-weight="700">新建任务</text><text x="22" y="53" class="faint" font-size="11">把下一步行动记录下来</text>
      <rect x="22" y="72" width="328" height="34" rx="8" fill="#fafbfc" stroke="#e7eaf0"/><text x="35" y="94" class="faint" font-size="11">任务名称</text><rect x="22" y="116" width="94" height="28" rx="14" class="button"/><text x="69" y="134" class="button-text" text-anchor="middle">取消</text><rect x="126" y="116" width="94" height="28" rx="14" class="accent-button"/><text x="173" y="134" class="accent-button-text" text-anchor="middle">保存任务</text>
    </g>
    <g transform="translate(30 252)">
      <rect width="764" height="130" rx="14" class="soft"/>
      <text x="22" y="30" class="title">专注时钟</text><text x="22" y="52" class="faint" font-size="11">独立窗口中持续显示，不打断主页浏览</text><circle cx="168" cy="91" r="27" fill="none" stroke="#e9ecf5" stroke-width="6"/><path d="M168 64 A27 27 0 0 1 192 103" fill="none" stroke="#6273d7" stroke-width="6" stroke-linecap="round"/><text x="168" y="96" class="ink" font-size="12" font-weight="700" text-anchor="middle">24:18</text><text x="240" y="82" class="small">专注中</text><text x="240" y="103" class="faint" font-size="10">按钮：暂停 · 重置 · 关闭窗口</text>
